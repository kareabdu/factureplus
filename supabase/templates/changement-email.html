<!-- Supabase › Authentication › Emails › « Change email address »
     Objet : Confirmez votre nouvelle adresse e-mail FacturePlus -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #1f2933;">
  <div style="padding: 24px 0; text-align: center;">
    <img src="https://factureplus.kareapps.com/logo.png" width="48" height="48" alt="FacturePlus" style="display: inline-block; width: 48px; height: 48px; border-radius: 12px; border: 0;">
    <div style="margin-top: 8px; font-size: 20px; font-weight: bold;">Facture<span style="color: #147A2E;">Plus</span></div>
  </div>
  <h1 style="font-size: 20px;">Nouvelle adresse e-mail</h1>
  <p>Confirmez le passage de {{ .Email }} à {{ .NewEmail }} avec ce code :</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; text-align: center; background: #F4F6F4; border-radius: 12px; padding: 16px;">{{ .Token }}</p>
  <p>Ou <a href="{{ .ConfirmationURL }}" style="color: #147A2E;">confirmez en cliquant ici</a>.</p>
  <p style="color: #8a949e; font-size: 13px;">Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail.</p>
</div>
